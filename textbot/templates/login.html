{% extends "base.html" %}
{% block title %}Sign in · Text Bot{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 40px auto;">
  <h1>Text Bot</h1>
  {% if error %}<div class="banner danger">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div class="field"><label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <div class="row"><button class="primary" type="submit" style="width: 100%">Sign in</button></div>
  </form>
</div>
{% endblock %}
